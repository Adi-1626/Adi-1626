<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>.p{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
.f{opacity:0;animation:f .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.s{animation:s 9s ease-in-out infinite alternate}@keyframes s{to{transform:translateX(-40px)}}</style>
<defs><radialGradient id="g" cx=".82" cy=".35" r=".55"><stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e4e6eb"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="1200" height="300" fill="#ffffff"/><rect width="1200" height="300" fill="url(#d)"/><rect width="1200" height="300" fill="url(#fade)"/>
<g class="s"><rect width="1300" height="300" fill="url(#g)"/></g></g>
<rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#e4e6eb"/>
<g class="f" style="animation-delay:.05s"><text x="64" y="92" font-size="14" fill="#5b616b" letter-spacing="2.5" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace">PUNE, INDIA · FULL STACK &amp; AI</text></g>
<g class="f" style="animation-delay:.15s"><text x="62" y="160" font-size="58" font-weight="700" fill="#0b0d12" letter-spacing="-1.8" style="font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Aditya Gawali</text></g>
<g class="f" style="animation-delay:.25s"><text x="64" y="200" font-size="20" fill="#5b616b" style="font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">I build real-time products and the AI and cloud systems behind them.</text></g>
<g class="f" style="animation-delay:.35s"><rect x="64" y="226" width="303" height="32" rx="16" fill="#ffffff" stroke="#e4e6eb"/>
<circle cx="84" cy="242" r="4.5" fill="#22c55e" class="p"/><text x="98" y="247" font-size="13" fill="#0b0d12" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace">Active now · last commit 5 days ago</text></g>
</svg>