<rect x="70" y="344" width="9" height="17" fill="#a5b4fc" class="cur"/>
<!-- sticky note -->
<g class="float" style="animation-delay:-2s"><g transform="rotate(4 830 130)">
<rect x="740" y="60" width="190" height="130" rx="6" fill="#fde68a"/><rect x="740" y="60" width="190" height="22" rx="6" fill="#fcd34d"/>
<text x="756" y="76" font-size="11" fill="#78350f" font-weight="700" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">NOW_BUILDING.txt</text>
<text x="756" y="108" font-size="15" fill="#451a03" font-weight="700" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">Haven ◉</text>
<text x="756" y="130" font-size="12" fill="#78350f" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">text · voice · screen share</text>
