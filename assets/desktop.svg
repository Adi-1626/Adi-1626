<g class="ln" style="animation-delay:2.80s"><text x="70" y="214" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#34d399">adi@adios</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#a5b4fc">ls ~/apps</tspan></text></g>
<g class="ln" style="animation-delay:3.35s"><text x="70" y="238" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#e2e8f0">haven  omnichat  clickbait-clarifier  vendorvault  portfolio</tspan></text></g>
<g class="ln" style="animation-delay:3.90s"><text x="70" y="262" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#34d399">adi@adios</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#a5b4fc">uptime</tspan></text></g>
<g class="ln" style="animation-delay:4.45s"><text x="70" y="286" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#e2e8f0">B.E. Computer Engineering '27 · Pune, India · CGPA 8.38</tspan></text></g>
<g class="ln" style="animation-delay:5.00s"><text x="70" y="310" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#34d399">adi@adios</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#a5b4fc">./open --hire-me</tspan></text></g>
