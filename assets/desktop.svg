</g></g>
</g>
<!-- boot overlay -->
<g class="boot">
<rect width="1000" height="430" rx="16" fill="#05070f"/>
<text x="500" y="200" font-size="30" fill="#e2e8f0" text-anchor="middle" font-weight="800" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">◆ AdiOS</text>
<rect x="400" y="228" width="200" height="4" rx="2" fill="#1e293b"/><rect x="400" y="228" width="200" height="4" rx="2" fill="#a78bfa" class="bar"/>
<text x="500" y="262" font-size="11" fill="#64748b" text-anchor="middle" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace">booting v2026.10 …</text>
</g>
</svg>