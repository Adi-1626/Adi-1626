<g class="ln" style="animation-delay:1.15s"><text x="70" y="142" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#e2e8f0">Aditya Nitin Gawali — Full Stack &amp; AI Engineer</tspan></text></g>
<g class="ln" style="animation-delay:1.70s"><text x="70" y="166" font-size="14.5" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"><tspan fill="#34d399">adi@adios</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#a5b4fc">cat role.txt</tspan></text></g>
