<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<style>
.ln{opacity:0;animation:show .01s forwards}
@keyframes show{to{opacity:1}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.boot{animation:fade 1.1s .2s forwards}
@keyframes fade{to{opacity:0;visibility:hidden}}
.bar{transform-origin:0 0;animation:load .9s ease-out forwards}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.orb{animation:spin 40s linear infinite;transform-origin:860px 300px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#1a1340"/><stop offset="1" stop-color="#0c1a2e"/></linearGradient>
<radialGradient id="glow" cx=".85" cy=".7" r=".5"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#6d28d9"/><stop offset="1" stop-color="#1e1b4b"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="r"><rect width="1000" height="430" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="430" fill="url(#wall)"/><rect width="1000" height="430" fill="url(#glow)"/>
<g fill="#fff" opacity=".5"><circle cx="120" cy="60" r="1"/><circle cx="300" cy="380" r="1.2"/><circle cx="520" cy="40" r=".8"/><circle cx="700" cy="90" r="1"/><circle cx="940" cy="150" r="1.3"/><circle cx="640" cy="400" r=".9"/><circle cx="40" cy="300" r="1"/><circle cx="820" cy="40" r=".7"/></g>
<g class="orb"><ellipse cx="860" cy="300" rx="120" ry="34" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="2 6"/><circle cx="980" cy="300" r="5" fill="#c4b5fd"/></g>
<circle cx="860" cy="300" r="48" fill="url(#planet)" class="float"/>
<!-- menu bar -->
<rect width="1000" height="30" fill="#0f172a" fill-opacity=".75"/>
<text x="18" y="20" font-size="13" fill="#e2e8f0" font-weight="700" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">◆ AdiOS</text>
<text x="100" y="20" font-size="13" fill="#94a3b8" style="font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">File   Edit   View   Apps   Help</text>
<text x="982" y="20" font-size="12" fill="#94a3b8" text-anchor="end" style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace">wifi ▂▄▆  ⚡ 100%  Pune · IST</text>
<!-- terminal window -->
<g filter="url(#sh)">
<rect x="40" y="56" width="660" height="340" rx="12" fill="#0b1220" fill-opacity=".94" stroke="#334155"/>
<rect x="40" y="56" width="660" height="34" rx="12" fill="#1e293b"/><rect x="40" y="78" width="660" height="12" fill="#1e293b"/>
<circle cx="62" cy="73" r="6" fill="#f87171"/><circle cx="82" cy="73" r="6" fill="#fbbf24"/><circle cx="102" cy="73" r="6" fill="#34d399"/>
